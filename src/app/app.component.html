<div class="app-shell">
  <div class="sidebar-backdrop" [class.sidebar-open]="sidebarOpen()" (click)="closeSidebar()" aria-hidden="true"></div>

  <aside class="sidebar" [class.sidebar-open]="sidebarOpen()">
    <div class="sidebar-head">
      <a routerLink="/" class="brand" (click)="closeSidebar()">
        <span class="brand-mark" aria-hidden="true">🚘</span>
        <span class="brand-name">Driving School</span>
      </a>
      <span class="sidebar-tag">Dashboard</span>
    </div>

    <nav class="sidebar-nav" aria-label="Main navigation">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeSidebar()">Dashboard</a>
      <a routerLink="/drivers" routerLinkActive="active" (click)="closeSidebar()">Drivers</a>
      <a routerLink="/routes" routerLinkActive="active" (click)="closeSidebar()">Routes</a>
      <a routerLink="/calendar" routerLinkActive="active" (click)="closeSidebar()">Calendar</a>
    </nav>

    <div class="sidebar-foot">
      <span>Demo data · kept in local state</span>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <button type="button" class="menu-toggle" (click)="toggleSidebar()" aria-label="Toggle navigation">☰</button>
      <span class="topbar-title">Driving School</span>
    </header>

    <main class="shell page">
      <router-outlet />
    </main>
  </div>
</div>
